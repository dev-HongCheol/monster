<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1280×720 판정 틀</title>
<!--
  폰트 판정 화면(?lab=font)을 정확한 1280×720으로 띄우는 틀(계획 docs/development/sessions/2026-11-01-ui-font-probe-plan.md §3.5).

  최소 글자 판정은 캔버스 1280×720 화소 · 배율 1에서 정의된다. 브라우저 창을 그 크기로 맞추기는 어렵고, 개발자 도구의
  기기 화면 모드는 보기 크기를 줄이거나 배율을 흉내 내 실제 글자 크기가 달라질 수 있다. 그래서 itch 임베드와 같은 방식으로
  빌드를 iframe 1280×720(CSS px)에 넣는다 — 배율 1이면 캔버스가 1280×720 화소가 된다.

  쓰는 법: 이 파일을 웹 빌드 폴더 맨 위(index.html 옆)에 복사하고 빌드와 같은 로컬 서버에서 연다.
    http://127.0.0.1:8080/embed-1280x720.html?lab=font
  이 페이지의 쿼리는 그대로 빌드에 넘어간다. 다른 주소의 빌드를 띄우려면 build=<주소>를 더하는데, http · https이면서
  호스트가 localhost · 127.0.0.1인 주소만 받는다 — 남이 만든 링크 하나로 이 틀이 외부 페이지를 띄우지 않게 하려는 것이다.
  호스트만 보면 javascript://localhost/… 같은 주소도 통과한다(호스트 칸이 localhost로 읽힌다). 그 주소를 iframe에 넣으면
  링크에 든 스크립트가 이 페이지의 출처에서 돈다.
  iframe에 sandbox를 걸지 않는다 — 걸면 판정 화면의 P(캡처) · K(판정값 저장) 파일 내려받기가 막힌다.
-->
<style>
  html, body { margin: 0; background: #0b0d12; color: #e6e6e6; font: 13px/1.5 system-ui, sans-serif; }
  #frame { display: block; width: 1280px; height: 720px; border: 0; }
  #note { padding: 8px 12px; }
  .warn { color: #ff9a9a; font-weight: bold; }
</style>
</head>
<body>
<iframe id="frame" title="판정 화면" allow="fullscreen"></iframe>
<div id="note"></div>
<script>
  (() => {
    const params = new URLSearchParams(location.search);
    const raw = params.get('build');
    params.delete('build');
    let base = new URL('index.html', location.href);
    if (raw !== null) {
      // 해석할 수 없는 주소(build=http:// 등)는 new URL이 예외를 던져 스크립트가 멈추고 틀이 빈 채로 남는다 —
      // 받지 않는 주소와 같이 경고하고 같은 폴더의 빌드를 띄운다
      let asked = null;
      try {
        asked = new URL(raw, location.href);
      } catch {
        asked = null;
      }
      const webScheme = asked !== null && (asked.protocol === 'http:' || asked.protocol === 'https:');
      const localHost = asked !== null && (asked.hostname === 'localhost' || asked.hostname === '127.0.0.1');
      if (webScheme && localHost) base = asked;
      else document.getElementById('note').innerHTML = '<span class="warn">build는 http · https의 localhost · 127.0.0.1만 받는다 — 같은 폴더의 index.html을 띄웠다</span>';
    }
    base.search = params.toString();
    const frame = document.getElementById('frame');
    frame.src = base.href;

    // iframe 안의 판정 화면이 키를 받으려면 초점이 iframe에 있어야 한다 — 틀 어디를 눌러도 iframe으로 돌려준다
    const focusFrame = () => frame.contentWindow?.focus();
    frame.addEventListener('load', focusFrame);
    document.addEventListener('pointerdown', focusFrame);

    const note = document.createElement('div');
    const render = () => {
      const dpr = window.devicePixelRatio;
      note.textContent = `배율 ${dpr} · 틀 1280×720(CSS px) · 띄운 빌드 ${base.href}`;
      note.className = dpr === 1 ? '' : 'warn';
      if (dpr !== 1) note.textContent += ' — 배율이 1이 아니다. Windows 화면 배율 100% · 브라우저 확대 100%로 맞추거나 Chrome을 --force-device-scale-factor=1로 띄운다';
    };
    document.getElementById('note').appendChild(note);
    render();
    window.addEventListener('resize', render);
  })();
</script>
</body>
</html>
