<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최소 글자 비교판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* UI 줄기 1층 L1-4 — 문자 체계별 최소 글자 크기를 사용자가 실제 모니터에서 판정한다. 2층 폰트 비교판의 첫 판이기도 하다. */
  :root { --bg: #111214; --fg: #d6d6da; --muted: #8e8e96; --line: #2a2b30; --accent: #e9ad4f; }
  * { box-sizing: border-box; }
  body { margin: 0; padding-block: 20px 48px; padding-inline: 20px; background: var(--bg); color: var(--fg); font: 14px/1.6 "Noto Sans KR", "Malgun Gothic", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 14px; max-width: 80ch; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 10px; }
  label { color: var(--muted); }
  select, input[type=text], input[type=number] { background: #1b1c20; color: var(--fg); border: 1px solid var(--line); padding: 4px 6px; font: inherit; }
  input[type=number] { width: 80px; } input[type=text] { width: 160px; }
  button { background: #23242a; color: var(--fg); border: 1px solid var(--line); padding: 6px 12px; font: inherit; cursor: pointer; }
  button.on { background: #3a3b44; }
  .ruler { height: 10px; width: 100px; background: repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 20px); border-bottom: 1px solid var(--accent); }
  .boards { display: grid; gap: 18px; }
  .board { padding: 18px 22px; border: 1px solid var(--line); }
  .board h2 { font-size: 13px; color: var(--muted); font-weight: 400; margin: 0 0 10px; font-family: "Noto Sans KR", sans-serif; }
  .line { display: grid; grid-template-columns: 56px 1fr; align-items: baseline; gap: 14px; margin: 6px 0; }
  .line .sz { color: var(--muted); font: 12px "Noto Sans KR", sans-serif; }
  .sample { white-space: nowrap; overflow-x: auto; }
  .sample span { margin-right: 1.4em; }
  .sample .num { font-variant-numeric: tabular-nums; }
  .outline .sample { paint-order: stroke fill; -webkit-text-stroke: 2px #0a0908; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .scaled { transform-origin: 0 0; }
  table { border-collapse: collapse; margin: 14px 0; }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  pre { background: #1b1c20; padding: 10px 12px; border: 1px solid var(--line); overflow-x: auto; }
</style>
</head>
<body>
  <h1>최소 글자 비교판</h1>
  <p class="lead">같은 문장을 14 · 16 · 18 · 20 · 24 논리 px로, 띠 상한 회색 · 네이비 패널 · 거의 검정 바탕 위에 늘어놓는다. 배율 1.0이 최소 지원 높이 720에서의 실제 크기다(L1-2). <b>브라우저 확대를 100%로 두고</b> 평소 앉는 거리에서 보고, 문자 체계마다 「이 크기부터 읽힌다」를 고른 뒤 아래 조건을 적고 「결과 복사」를 누른다. 금색 눈금은 100 CSS px다.</p>
  <div class="row">
    <label>글꼴 <select id="font">
      <option value='Arial, "Malgun Gothic", sans-serif'>시스템(Arial · 맑은 고딕 — 지금 씬 조건)</option>
      <option value='"Noto Sans KR", sans-serif'>Noto Sans KR</option>
      <option value='"Gowun Dodum", sans-serif'>Gowun Dodum</option>
      <option value='"IBM Plex Sans KR", sans-serif'>IBM Plex Sans KR</option>
      <option value='"Nanum Gothic", sans-serif'>Nanum Gothic</option>
    </select></label>
    <label>굵기 <select id="weight"><option value="400">400</option><option value="500" selected>500</option><option value="700">700</option></select></label>
    <label>배율 <select id="scale"><option value="1">1.0 (높이 720)</option><option value="0.75">0.75 (높이 540, 보장 밖 참고)</option><option value="1.5">1.5 (높이 1080)</option></select></label>
    <button id="outline" class="on" type="button">외곽선(자체 바탕)</button>
    <span class="ruler" title="100 CSS px"></span>
  </div>
  <div class="boards scaled" id="boards"></div>

  <h2 style="font-size:15px;margin:22px 0 6px">판정 기록</h2>
  <div class="row">
    <label>라틴 · 숫자 하한(px) <input type="number" id="latin" value="14" min="10" max="30"></label>
    <label>한글 하한(px) <input type="number" id="hangul" value="16" min="10" max="30"></label>
  </div>
  <div class="row">
    <label>모니터 <input type="text" id="monitor" placeholder="27인치 2560×1440"></label>
    <label>거리(cm) <input type="number" id="dist" value="60" min="20" max="200"></label>
    <label>OS 배율 <input type="text" id="dpi" placeholder="100%"></label>
    <label>메모 <input type="text" id="note" placeholder="예: 14는 한글 받침이 뭉개짐"></label>
    <button id="copy" type="button">결과 복사</button>
  </div>
  <pre id="plain"></pre>

<script>
  const sizes = [14, 16, 18, 20, 24];
  const samples = [
    ['라틴', '<span>Wave 7</span><span>Lv.14</span><span>RETRY</span><span>Main Menu</span><span>Hauptmenü</span>'],
    ['숫자', '<span class="num">12:48</span><span class="num">1,205</span><span class="num">+30%</span><span class="num">487</span>'],
    ['한글', '<span>파이어볼 발사체 수 +1레벨</span><span>모든 마법 쿨다운 -5%</span><span>일시정지</span>'],
    ['섞임', '<span>Fire · 얼음 미사일 · Lightning Bolt</span><span>웨이브 7 도달</span>'],
  ];
  const bgs = [['띠 상한 회색 #505050 (휘도 0.08)', '#505050', '#f3efe6'], ['네이비 패널 #242b3c (참고 그림)', '#242b3c', '#f5dda6'], ['거의 검정 #0d0d0d (띠 하한)', '#0d0d0d', '#f3efe6']];
  const boards = document.getElementById('boards');
  function render() {
    const font = document.getElementById('font').value, weight = document.getElementById('weight').value;
    boards.innerHTML = bgs.map(([name, bg, fg]) => `<div class="board" style="background:${bg};color:${fg}"><h2 style="color:${fg};opacity:.7">${name}</h2>` +
      sizes.map(s => `<div class="line"><span class="sz" style="color:${fg};opacity:.6">${s}px</span><div class="sample" data-size="${s}">${samples.map(([k, html]) => html).join('')}</div></div>`).join('') + '</div>').join('');
    // 글꼴 이름에 따옴표가 들어 있어 style 속성 문자열로 넣으면 속성이 끊긴다 — 크기 · 글꼴은 JS로 직접 넣는다
    for (const el of boards.querySelectorAll('.sample')) {
      el.style.fontFamily = font; el.style.fontWeight = weight; el.style.fontSize = el.dataset.size + 'px'; el.style.lineHeight = '1.3';
    }
    const sc = +document.getElementById('scale').value;
    boards.style.transform = `scale(${sc})`; boards.style.width = sc === 1 ? '' : `${100 / sc}%`;
    plain();
  }
  function plain() {
    const g = id => document.getElementById(id).value;
    const t = `| 최소 글자 | 라틴 · 숫자 ${g('latin')}px · 한글 ${g('hangul')}px | 글꼴 ${document.getElementById('font').selectedOptions[0].text} ${g('weight')} · 배율 ${g('scale')} · 외곽선 ${document.getElementById('outline').classList.contains('on') ? '있음' : '없음'} | 모니터 ${g('monitor') || '?'} · 거리 ${g('dist')}cm · OS 배율 ${g('dpi') || '?'} | ${g('note')} |`;
    document.getElementById('plain').textContent = t; return t;
  }
  for (const id of ['font', 'weight', 'scale']) document.getElementById(id).addEventListener('change', render);
  for (const id of ['latin', 'hangul', 'monitor', 'dist', 'dpi', 'note']) document.getElementById(id).addEventListener('input', plain);
  document.getElementById('outline').addEventListener('click', e => { e.target.classList.toggle('on'); boards.classList.toggle('outline', e.target.classList.contains('on')); plain(); });
  document.getElementById('copy').addEventListener('click', async () => { const t = plain(); try { await navigator.clipboard.writeText(t); } catch { window.getSelection().selectAllChildren(document.getElementById('plain')); } });
  boards.classList.add('outline');
  render();
</script>
</body>
</html>
