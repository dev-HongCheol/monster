<!doctype html>
<!--
  G4 층 합성 화면 — 구운 다섯 층을 게임의 형제 순서(몸 → 상의 → 지팡이 → 방패)로 겹쳐 재생한다.

  `bake.ts preview`가 스크립트의 `DATA` 자리표시자에 값을 박아 `docs/temp/3d-gate/g4/preview.html`로 쓴다.
  그림은 그 옆의 `layers/<층>/<방향>/<이름>.png`를 상대 경로로 읽으므로 파일을 브라우저로 바로 연다.

  자리표시자 문자열을 이 주석에 그대로 적지 않는다. 실행기는 처음 나오는 한 곳만 바꾸므로, 여기 적으면
  값이 스크립트가 아니라 주석에 박히고 화면은 빈 채로 뜬다(2026-09-21에 실제로 그랬다).

  층마다 캔버스가 다르다(몸 · 상의 264×493, 무기 600×701). 전부 같은 카메라로 구웠으므로 캔버스 중심만
  맞추면 겹친다 — 게임이 자식 노드를 원점에 두는 것과 같다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>G4 층 합성</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #1d1f24; color: #e6e6e6; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  fieldset { display: inline-block; border: 1px solid #444; border-radius: 6px; margin: 0 8px 8px 0; padding: 4px 10px; }
  legend { color: #9aa; font-size: 12px; }
  label { margin-right: 10px; white-space: nowrap; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  figcaption { color: #9aa; font-size: 12px; margin-top: 4px; }
  canvas { display: block; image-rendering: auto; }
  .note { color: #9aa; font-size: 12px; max-width: 900px; }
</style>
</head>
<body>
<h1>G4 층 합성 — 몸 → 상의 → 지팡이 → 방패</h1>
<div>
  <fieldset><legend>동작</legend>
    <label><input type="radio" name="action" value="walk" checked> 걷기</label>
    <label><input type="radio" name="action" value="idle"> 대기</label>
  </fieldset>
  <fieldset><legend>상의</legend>
    <label><input type="radio" name="top" value="topA" checked> A</label>
    <label><input type="radio" name="top" value="topB"> B</label>
    <label><input type="radio" name="top" value=""> 없음</label>
  </fieldset>
  <fieldset><legend>무기</legend>
    <label><input type="checkbox" id="staff" checked> 지팡이</label>
    <label><input type="checkbox" id="shield" checked> 방패</label>
  </fieldset>
  <fieldset><legend>크기</legend>
    <label><input type="radio" name="scale" value="game"> 720p 게임 크기</label>
    <label><input type="radio" name="scale" value="game2"> 1440p</label>
    <label><input type="radio" name="scale" value="0.6" checked> 60%</label>
    <label><input type="radio" name="scale" value="1"> 원본</label>
  </fieldset>
  <fieldset><legend>배경</legend>
    <label><input type="radio" name="bg" value="#3a4a3a" checked> 풀색</label>
    <label><input type="radio" name="bg" value="#15171b"> 어둠</label>
    <label><input type="radio" name="bg" value="#d8d8d8"> 밝음</label>
  </fieldset>
  <fieldset><legend>보기</legend>
    <label><input type="checkbox" id="ground" checked> 발밑 점</label>
    <label><input type="checkbox" id="paused"> 멈춤</label>
    <label>걷기 <input type="number" id="walkFps" min="1" max="30" style="width:3.5em"> fps</label>
    <label>대기 <input type="number" id="idleFps" min="1" max="30" style="width:3.5em"> fps</label>
  </fieldset>
</div>
<div class="row" id="cells"></div>
<p class="note">
  맨 오른쪽 칸은 제자리에서 정면 → 오른쪽 → 뒤 → 왼쪽으로 돌아선다. 발밑 점(주황 십자)은 네 방향에서 같은 픽셀이고,
  머리와 발끝의 행은 방향마다 몇 픽셀 다르다 — 위에서 비스듬히 보는 카메라에서 제자리 회전이 실제로 그렇게 보인다.
  게임 크기는 브라우저의 축소라 엔진의 축소와 완전히 같지는 않다.
</p>
<script>
const DATA = /*__DATA__*/null;
const state = { action: 'walk', top: 'topA', staff: true, shield: true, scale: '0.6', bg: '#3a4a3a',
  ground: true, paused: false, walkFps: DATA.fps.walk, idleFps: DATA.fps.idle };
const stage = DATA.stage;
const images = new Map();

function pad(n) { return String(n).padStart(2, '0'); }
function frameImage(layer, action, facing, index) {
  const name = `${layer}_${action}_${facing}_${pad(index)}`;
  if (!images.has(name)) {
    const img = new Image();
    img.src = `${DATA.root}/${layer}/${facing}/${name}.png`;
    images.set(name, img);
  }
  return images.get(name);
}
// 미리 읽어 둔다. 재생 도중에 읽으면 첫 바퀴에서 층이 한 박자 늦게 나타나 어긋난 것처럼 보인다
for (const layer of Object.keys(DATA.layers))
  for (const facing of DATA.facings)
    for (const [action, count] of Object.entries(DATA.frames))
      for (let i = 0; i < count; i++) frameImage(layer, action, facing.id, i);

function scaleValue() {
  const game = DATA.gameHeightUnits / DATA.bodyHeight;
  if (state.scale === 'game') return game;
  if (state.scale === 'game2') return game * 2;
  return Number(state.scale);
}

const cells = [];
function build() {
  const host = document.getElementById('cells');
  for (const facing of [...DATA.facings, { id: null, label: '제자리에서 돌아서기' }]) {
    const figure = document.createElement('figure');
    const canvas = document.createElement('canvas');
    const caption = document.createElement('figcaption');
    caption.textContent = facing.label;
    figure.append(canvas, caption);
    host.append(figure);
    cells.push({ canvas, facing: facing.id });
  }
}

function frameIndex(action, t) {
  if (action === 'walk') return Math.floor(t * state.walkFps) % DATA.frames.walk;
  return DATA.idleOrder[Math.floor(t * state.idleFps) % DATA.idleOrder.length];
}

function draw(cell, t) {
  const scale = scaleValue();
  const width = Math.max(1, Math.round(stage.width * scale));
  const height = Math.max(1, Math.round(stage.height * scale));
  if (cell.canvas.width !== width || cell.canvas.height !== height) {
    cell.canvas.width = width;
    cell.canvas.height = height;
  }
  const ctx = cell.canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = state.bg;
  ctx.fillRect(0, 0, width, height);

  // 돌아서는 칸은 대기를 재생하며 1.2초마다 방향을 바꾼다
  const turning = cell.facing === null;
  const facing = turning ? DATA.facings[Math.floor(t / 1.2) % DATA.facings.length].id : cell.facing;
  const action = turning ? 'idle' : state.action;
  const index = frameIndex(action, t);

  const order = ['body', state.top, state.staff ? 'staff' : '', state.shield ? 'shield' : ''];
  for (const layer of order) {
    if (!layer) continue;
    const img = frameImage(layer, action, facing, index);
    if (!img.complete || img.naturalWidth === 0) continue;
    const size = DATA.layers[layer];
    ctx.drawImage(img, ((stage.width - size.width) / 2) * scale, ((stage.height - size.height) / 2) * scale,
      size.width * scale, size.height * scale);
  }

  if (state.ground) {
    const x = (stage.width / 2) * scale;
    const y = (DATA.groundRow + (stage.height - DATA.bodyHeight) / 2) * scale;
    const arm = Math.max(3, 10 * scale);
    ctx.strokeStyle = '#ff9a3c';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - arm, y); ctx.lineTo(x + arm, y);
    ctx.moveTo(x, y - arm); ctx.lineTo(x, y + arm);
    ctx.stroke();
  }
}

function bind() {
  for (const name of ['action', 'top', 'scale', 'bg'])
    for (const el of document.querySelectorAll(`input[name=${name}]`))
      el.addEventListener('change', () => { if (el.checked) state[name] = el.value; });
  for (const id of ['staff', 'shield', 'ground', 'paused']) {
    const el = document.getElementById(id);
    el.addEventListener('change', () => { state[id] = el.checked; });
  }
  for (const id of ['walkFps', 'idleFps']) {
    const el = document.getElementById(id);
    el.value = state[id];
    el.addEventListener('change', () => { state[id] = Math.max(1, Number(el.value) || 1); });
  }
}

build();
bind();
let clock = 0;
let last = performance.now();
(function tick(now) {
  if (!state.paused) clock += (now - last) / 1000;
  last = now;
  for (const cell of cells) draw(cell, clock);
  requestAnimationFrame(tick);
})(last);
</script>
</body>
</html>
