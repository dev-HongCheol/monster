<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>알파 뷰어 — Monster</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --panel-2: #232734;
    --line: #333949;
    --text: #e7e9ef;
    --muted: #9aa1b2;
    --accent: #6ea8ff;
    --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: grid;
    grid-template-columns: 340px 1fr;
    height: 100vh;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 18px 16px 40px;
    overflow-y: auto;
  }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
  .group { margin-bottom: 20px; }
  .group > .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }

  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 12px; font: inherit; font-weight: 600; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .btn:hover { border-color: #46506a; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #10131a; }
  .btn.on { border-color: var(--accent); color: var(--accent); }

  .sheetlist { display: grid; gap: 10px; }
  .sheetgroup > .name { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .dirs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .dirs .btn { padding: 7px 4px; font-size: 12px; font-weight: 600; }

  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
  .sw {
    height: 30px; border-radius: 7px; border: 1px solid var(--line); cursor: pointer; padding: 0;
    transition: transform .1s, border-color .12s;
  }
  .sw:hover { transform: translateY(-1px); }
  .sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110,168,255,.35); }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .row .name { flex: 0 0 66px; font-size: 12px; color: var(--muted); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .val { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; margin-top: 10px; font-size: 13px; }
  .toggle input { accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); cursor: pointer; padding: 2px; }
  input[type=file] { display: none; }

  main { position: relative; overflow: hidden; }
  /*
   * 넘칠 때 가장자리가 잘리지 않게 `margin:auto`로 가운데를 잡는다. `justify-content:center`는
   * 내용이 컨테이너보다 커지는 순간 위·왼쪽이 스크롤 범위 밖으로 밀려 영영 못 본다 —
   * 확대해서 눈을 들여다보는 것이 이 도구의 용도라 그 상태가 곧 못 쓰는 상태다.
   */
  #stage {
    position: absolute; inset: 0; display: flex;
    overflow: auto; cursor: grab;
  }
  #stage.grabbing { cursor: grabbing; }
  #single { margin: auto; padding: 40px; }
  /* 한 장 보기와 격자 보기가 같은 클래스를 쓴다. 자리마다 규칙을 따로 두면 확대·보간이 한쪽만
     바뀌는 상태가 생기고, 그 상태는 두 보기를 오갈 때만 드러난다. */
  .sprite { display: block; image-rendering: pixelated; }
  .sprite.smooth { image-rendering: auto; }

  #grid { display: none; grid-template-columns: repeat(4, max-content); gap: 10px; padding: 24px; }
  .cell { position: relative; }
  .cell .cap {
    position: absolute; left: 0; right: 0; bottom: -18px; text-align: center;
    font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: linear-gradient(#14161cdd, #14161c00);
    pointer-events: none; font-size: 12px; color: var(--muted);
  }
  #topbar b { color: var(--text); font-weight: 600; }
  #err {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    color: var(--warn); font-size: 13px; line-height: 1.7; padding: 40px;
  }
</style>
</head>
<body>

<aside>
  <h1>알파 뷰어</h1>
  <p class="sub">배경색을 바꿔 가며 <b>투명하면 안 되는 자리가 투명한지</b>를 눈으로 본다.</p>

  <div class="group">
    <div class="label">대상</div>
    <div class="card">
      <div class="sheetlist" id="sheetlist"></div>
      <button type="button" class="btn" id="pick" style="width:100%;margin-top:10px">파일 선택…</button>
      <input type="file" id="file" accept="image/*" />
      <div class="hint" id="current">—</div>
    </div>
  </div>

  <div class="group">
    <div class="label">배경</div>
    <div class="card">
      <div class="swatches" id="swatches"></div>
      <input type="color" id="custom" value="#ff00ff" />
      <label class="toggle"><input type="checkbox" id="checker" checked> 체커보드</label>
      <label class="toggle"><input type="checkbox" id="cycle"> 자동 순환</label>
      <div class="row"><span class="name">주기</span>
        <input type="range" id="period" min="200" max="2000" step="100" value="700"><span class="val" id="period-v">700</span></div>
      <div class="hint">눈 흰자처럼 <b>밝은 자리</b>가 뚫렸는지는 어두운 배경에서, 어두운 자리는 밝은 배경에서 드러난다. 한 색만 보면 놓친다.</div>
    </div>
  </div>

  <div class="group">
    <div class="label">보기</div>
    <div class="card">
      <div class="row"><span class="name">확대</span>
        <input type="range" id="zoom" min="1" max="16" step="0.5" value="2"><span class="val" id="zoom-v">2×</span></div>
      <label class="toggle"><input type="checkbox" id="smooth"> 픽셀 보간 켜기</label>
      <label class="toggle"><input type="checkbox" id="gridmode"> 열두 장 한눈에</label>
      <div class="hint">스테이지를 드래그하면 이동, <b>←→</b>로 대상 전환, 휠로 확대.</div>
    </div>
  </div>
</aside>

<main>
  <div id="topbar"><b id="tb-name">—</b><span id="tb-bg"></span></div>
  <div id="stage">
    <div id="single"><img id="img" alt="sprite" /></div>
    <div id="grid"></div>
  </div>
  <div id="err">이미지를 못 불러왔어요.<br>이 파일은 저장소 최상단에서 열어야 상대 경로가 풀립니다.<br><b>파일 선택…</b>으로 직접 지정할 수도 있어요.</div>
</main>

<script>
const $ = (id) => document.getElementById(id);

/**
 * 이 파이프라인이 내보내는 열두 장 — `tools/art/build.ts`의 SHEETS와 같은 순서다.
 * 넷은 게임에 나가고 여덟은 v2 파츠 컷의 입력이라, 눈검사도 열둘을 함께 본다.
 */
const SHEETS = [
  { name: "옷 입은 판 (게임에 나감)", dir: "game/assets/art/player", prefix: "player_4dir" },
  { name: "대머리 판 (v2 입력)",      dir: "art-source/player/base", prefix: "player_bald" },
  { name: "맨살 판 (v2 입력)",        dir: "art-source/player/base", prefix: "player_base" },
];
const DIRECTIONS = ["front", "back", "left", "right"];

/** 배경 프리셋 — 밝기와 색상을 넓게 벌려 둔다. 비슷한 색만 돌면 뚫린 자리를 못 본다. */
const PRESETS = ["#ffffff", "#000000", "#ff00ff", "#00ff88", "#1e6bff", "#808080"];

const state = {
  src: null, label: "—",
  bg: "#ff00ff", checker: true, cycle: false, period: 700,
  zoom: 2, smooth: false, grid: false,
  cycleIndex: 0,
};

// ---- 대상 목록 ----
const flat = [];
for (const s of SHEETS) {
  for (const d of DIRECTIONS) {
    flat.push({ src: `${s.dir}/${s.prefix}_${d}.png`, label: `${s.prefix}_${d}` });
  }
}

$("sheetlist").innerHTML = SHEETS.map((s, si) => `
  <div class="sheetgroup">
    <div class="name">${s.name}</div>
    <div class="dirs">${DIRECTIONS.map((d, di) => `
      <button type="button" class="btn" data-i="${si * 4 + di}">${d}</button>`).join("")}</div>
  </div>`).join("");

$("sheetlist").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (b) select(Number(b.dataset.i));
});

function select(i) {
  const entry = flat[((i % flat.length) + flat.length) % flat.length];
  state.index = i;
  state.src = entry.src;
  state.label = entry.label;
  const active = ((i % flat.length) + flat.length) % flat.length;
  for (const b of document.querySelectorAll("#sheetlist .btn")) {
    b.classList.toggle("on", Number(b.dataset.i) === active);
  }
  render();
}

// ---- 배경 ----
$("swatches").innerHTML = PRESETS.map((c) =>
  `<button type="button" class="sw" data-c="${c}" style="background:${c}"></button>`).join("");
$("swatches").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-c]");
  if (!b) return;
  state.bg = b.dataset.c;
  state.checker = false;
  $("checker").checked = false;
  render();
});
$("custom").addEventListener("input", (e) => {
  state.bg = e.target.value;
  state.checker = false;
  $("checker").checked = false;
  render();
});

// ---- 나머지 컨트롤 ----
const bind = (id, key, transform = (v) => v, after = null) => {
  const el = $(id);
  const read = () => (el.type === "checkbox" ? el.checked : transform(el.value));
  el.addEventListener("input", () => {
    state[key] = read();
    if (after) after();
    render();
  });
};
bind("checker", "checker");
// **자동 순환을 켜면 체커보드를 끈다.** 체커보드가 켜져 있으면 `backgroundCss`가 순환하는
// 색을 안 보므로, 켜 놓은 채로 순환을 켜면 같은 무늬만 다시 칠해진다 — 화면이 안 변하니
// 사람은 기능이 없는 줄 안다. 체커보드가 기본값이라 그 상태로 출발한다.
bind("cycle", "cycle", (v) => v, () => {
  if (state.cycle && state.checker) {
    state.checker = false;
    $("checker").checked = false;
  }
  resetCycle();
});
bind("period", "period", Number, () => { $("period-v").textContent = state.period; resetCycle(); });
bind("zoom", "zoom", Number, () => { $("zoom-v").textContent = `${state.zoom}×`; });
bind("smooth", "smooth");
bind("gridmode", "grid");

$("pick").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => {
  const f = e.target.files?.[0];
  if (!f) return;
  state.src = URL.createObjectURL(f);
  state.label = f.name;
  for (const b of document.querySelectorAll("#sheetlist .btn")) b.classList.remove("on");
  render();
});

// ---- 자동 순환 ----
let cycleTimer = null;
function resetCycle() {
  if (cycleTimer) clearInterval(cycleTimer);
  cycleTimer = null;
  if (!state.cycle) return;
  cycleTimer = setInterval(() => {
    state.cycleIndex = (state.cycleIndex + 1) % PRESETS.length;
    render();
  }, state.period);
}

/** 지금 칠할 배경. 자동 순환이 켜져 있으면 프리셋을 돌고, 체커보드는 그 위를 덮는다. */
function activeBg() {
  return state.cycle ? PRESETS[state.cycleIndex] : state.bg;
}

function backgroundCss() {
  const c = activeBg();
  if (!state.checker) return { background: c };
  // 체커보드는 두 회색을 겹친 그라디언트로 만든다. 배경 이미지를 안 쓰므로 file://에서도 뜬다.
  const a = "#f0f0f0", b = "#c0c0c0";
  return {
    background:
      `repeating-conic-gradient(${a} 0% 25%, ${b} 0% 50%) 50% / 16px 16px`,
  };
}

// ---- 그리기 ----

/**
 * 한 장의 보간 방식과 폭을 지금 상태에 맞춘다.
 *
 * 확대를 `transform`이 아니라 실제 폭으로 주는 이유가 있다. `transform`은 레이아웃을 안
 * 늘려 스크롤 범위가 원본 크기에 묶이고, 그러면 8배로 키운 뒤 얼굴로 갈 방법이 없다.
 *
 * **폭의 기준은 그 그림의 자연 크기다.** 캔버스 246을 상수로 박으면 파일 선택으로 연 다른
 * 크기의 그림에서 배율이 어긋나고, 슬라이더가 「8×」라고 적힌 채 실제로는 다른 배율이 된다.
 */
function sizeSprite(img) {
  img.className = state.smooth ? "sprite smooth" : "sprite";
  if (img.naturalWidth) img.style.width = `${img.naturalWidth * state.zoom}px`;
}

let gridBuilt = false;

/**
 * 격자 열두 칸을 **한 번만** 만든다.
 *
 * `render()`는 휠 한 칸마다, 자동 순환 주기(최소 200ms)마다 불린다. 그때마다 `innerHTML`을
 * 다시 쓰면 열두 장이 통째로 버려졌다 다시 만들어져 깜빡이고, 스테이지 스크롤이 맨 위로
 * 돌아간다 — 얼굴로 팬해 놓고 순환을 켜면 자리를 잃는다.
 */
function buildGrid() {
  $("grid").innerHTML = flat
    .map(
      (f) => `
      <div class="cell">
        <img src="${f.src}" alt="${f.label}" class="sprite" />
        <div class="cap">${f.label}</div>
      </div>`,
    )
    .join("");
  // 자연 크기는 로드가 끝나야 읽히므로 각 칸이 뜬 뒤 한 번 더 잰다.
  for (const img of $("grid").querySelectorAll("img")) {
    img.addEventListener("load", () => sizeSprite(img));
  }
  gridBuilt = true;
}

function render() {
  const css = backgroundCss();
  const stage = $("stage");
  stage.style.background = css.background;
  $("tb-bg").textContent = state.checker ? "배경: 체커보드" : `배경: ${activeBg()}`;
  $("tb-name").textContent = state.label;
  $("current").textContent = state.src ? `현재: ${state.src}` : "—";

  $("single").style.display = state.grid ? "none" : "block";
  $("grid").style.display = state.grid ? "grid" : "none";

  if (state.grid) {
    if (!gridBuilt) buildGrid();
    for (const cell of $("grid").querySelectorAll("img")) sizeSprite(cell);
    $("err").style.display = "none";
    return;
  }

  const img = $("img");
  if (state.src && img.getAttribute("src") !== state.src) img.src = state.src;
  sizeSprite(img);
}

$("img").addEventListener("error", () => { $("err").style.display = "grid"; });
$("img").addEventListener("load", () => {
  $("err").style.display = "none";
  // 자연 크기는 로드가 끝나야 읽히므로, 폭은 여기서 한 번 더 잡는다.
  sizeSprite($("img"));
});

// ---- 이동·확대 ----
const stage = $("stage");
let dragging = false, sx = 0, sy = 0, sl = 0, st = 0;
stage.addEventListener("pointerdown", (e) => {
  dragging = true; sx = e.clientX; sy = e.clientY; sl = stage.scrollLeft; st = stage.scrollTop;
  stage.classList.add("grabbing"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  stage.scrollLeft = sl - (e.clientX - sx);
  stage.scrollTop = st - (e.clientY - sy);
});
// `pointercancel`도 함께 받는다. 브라우저가 제스처를 가져가면 캡처만 풀리고 `pointerup`은
// 안 오는데, 그러면 `dragging`이 참인 채로 남아 다음에 **누르지 않고** 움직여도 화면이 끌린다.
const endDrag = (e) => {
  dragging = false;
  stage.classList.remove("grabbing");
  if (stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId);
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const next = Math.min(16, Math.max(1, state.zoom + (e.deltaY < 0 ? 0.5 : -0.5)));
  state.zoom = next;
  $("zoom").value = String(next);
  $("zoom-v").textContent = `${next}×`;
  render();
}, { passive: false });

window.addEventListener("keydown", (e) => {
  // 슬라이더와 버튼 위에서는 안 가로챈다. 확대·주기를 ←→로 미세 조정하는 것이 그것들을 쓰는
  // 정상적인 방법인데, 그때 대상까지 함께 넘어가면 보던 자리를 잃는다.
  if (e.target instanceof Element && e.target.closest("input, button, select, textarea")) return;
  if (e.key === "ArrowRight") select((state.index ?? 0) + 1);
  else if (e.key === "ArrowLeft") select((state.index ?? 0) - 1);
});

select(2); // 눈이 뚫려 있던 장이 옷 입은 판의 left라 거기서 시작한다
</script>
</body>
</html>
